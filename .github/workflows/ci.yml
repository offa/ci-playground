name: ci

on:
  push:
    branches:

jobs:
  build_linux:
    runs-on: windows-latest
    name: "Test"
    steps:
      - uses: actions/checkout@main
      - name: Setup Ninja
        uses: turtlesec-no/get-ninja@main
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" 
      - name: Build
        run: ./test.sh
        shell: bash
